[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mini-react-agent"
version = "0.4.0"
description = "A small, workspace-confined ReAct coding agent for learning and experimentation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50,<3",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[project.scripts]
mini-agent = "mini_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
